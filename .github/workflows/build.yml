name: Compilar APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar codigo
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Generar Gradle Wrapper Automaticamente
      run: |
        gradle --version || true
        gradle_version="8.4"
        curl -sLo gradle.zip https://services.gradle.org/distributions/gradle-${gradle_version}-bin.zip
        unzip -q gradle.zip
        gradle-${gradle_version}/bin/gradle wrapper --gradle-version ${gradle_version}

    - name: Permisos para Gradle
      run: chmod +x gradlew || true

    - name: Compilar APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Subir APK generado
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
